name: Regenerar gráficos

# Cuando cambian los datos (CSV) o el script, regenera los PNG y los commitea de vuelta.
on:
  push:
    branches: [main]
    paths:
      - '*.csv'
      - 'analisis_melate.py'
      - '.github/workflows/regenerar-graficos.yml'
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para que el bot haga push de los gráficos

# Evita que dos ejecuciones se pisen si llegan varios push seguidos.
concurrency:
  group: regenerar-graficos
  cancel-in-progress: true

jobs:
  graficos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Regenerar los 5 gráficos
        run: python analisis_melate.py --grafico

      - name: Commitear los gráficos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          if git diff --staged --quiet; then
            echo "Los gráficos no cambiaron; nada que commitear."
          else
            git commit -m "Regenera gráficos automáticamente [skip ci]"
            git push
          fi
